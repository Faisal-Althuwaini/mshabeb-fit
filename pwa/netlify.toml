# Deployed from a local build: `npm run build && npx netlify deploy --prod --dir dist`
# (the Thmanyah font files are not in git; see DECISIONS.md D17).
[build]
  publish = "dist"

# The app lives on its own domain; send the default netlify.app address there so the
# home-screen app, login and notifications all use one origin.
[[redirects]]
  from = "https://mushabbab-coach.netlify.app/*"
  to = "https://mushabbab.faisalalthuwaini.sa/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), geolocation=(), microphone=()"
